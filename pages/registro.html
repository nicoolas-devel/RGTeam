<!DOCTYPE html>
<html lang="es">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Registro | RGTeam</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Bootstrap Icons -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  >

  <!-- Fuente -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap"
    rel="stylesheet"
  >

  <!-- CSS -->
  <link rel="stylesheet" href="../css/registro.css">

</head>

<body>

  <main class="contenedor-principal">

    <section class="contenedor-registro">

      <div class="titulo-registro">

        <h1>Crear Cuenta</h1>

        <p>
          Registrate para acceder a la tienda de RGTeam
        </p>

      </div>

      <form>

        <div class="grupo-input">
          <label>Nombre y apellido</label>

          <input
            type="text"
            class="form-control input-rg"
            placeholder="Ingresá tu nombre completo"
            required
          >
        </div>

        <div class="grupo-input">
          <label>Nombre de usuario</label>

          <input
            type="text"
            class="form-control input-rg"
            placeholder="Ej: nicolas_rg"
            required
          >
        </div>

        <div class="grupo-input">
          <label>Correo electrónico</label>

          <input
            type="email"
            class="form-control input-rg"
            placeholder="correo@ejemplo.com"
            required
          >
        </div>

        <div class="grupo-input">
          <label>Teléfono</label>

          <input
            type="tel"
            class="form-control input-rg"
            placeholder="381-0000000"
            required
          >
        </div>

        <div class="grupo-input">
          <label>Domicilio</label>

          <input
            type="text"
            class="form-control input-rg"
            placeholder="Ingresá tu dirección"
            required
          >
        </div>

        <div class="grupo-input">
          <label>Código postal</label>

          <input
            type="text"
            class="form-control input-rg"
            placeholder="4000"
            required
          >
        </div>

        <div class="grupo-input">
          <label>Contraseña</label>

          <input
            type="password"
            class="form-control input-rg"
            placeholder="********"
            required
          >
        </div>

        <button type="submit" class="boton-registro">

          <i class="bi bi-person-plus"></i>

          Registrarse

        </button>

      </form>

      <div class="volver-inicio">

        <a href="../index.html">

          <i class="bi bi-arrow-left"></i>

          Volver al inicio

        </a>

      </div>

    </section>

  </main>

</body>
</html>
