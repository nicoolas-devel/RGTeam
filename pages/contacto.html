<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contacto | RGTeam</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Bootstrap Icons -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  >

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap"
    rel="stylesheet"
  >

  <!-- CSS -->
  <link rel="stylesheet" href="../css/styles.css">

</head>

<body>

  <section class="contacto-section container">

<div class="text-center mb-5">

  <h1 class="titulo-contacto">
    CONTACTO
  </h1>

         <p class="subtitulo-contacto">
            ¿Tenés alguna consulta? Contactanos y te responderemos lo antes posible.
         </p>

          </div>

    <div class="row g-4">

      <!-- FORMULARIO -->
      <div class="col-lg-6">

        <div class="card-contacto">

          <h3 class="mb-4">
            Envíanos un mensaje
          </h3>

          <form>

            <div class="mb-3">
              <input
                type="text"
                class="form-control input-contacto"
                placeholder="Nombre completo"
                required
              >
            </div>

            <div class="mb-3">
              <input
                type="email"
                class="form-control input-contacto"
                placeholder="Correo electrónico"
                required
              >
            </div>

            <div class="mb-3">
              <input
                type="text"
                class="form-control input-contacto"
                placeholder="Asunto"
                required
              >
            </div>

            <div class="mb-3">
              <textarea
                class="form-control input-contacto"
                rows="5"
                placeholder="Escribe tu mensaje..."
                required
              ></textarea>
            </div>

            <button
              type="submit"
              class="btn boton-contacto"
            >
              Enviar consulta
            </button>

          </form>

        </div>

      </div>

      <!-- MAPA -->
      <div class="col-lg-6">

        <div class="card-contacto h-100">

          <h3 class="mb-4">
            Nuestra ubicación
          </h3>

          <p class="direccion-contacto">

            <i class="bi bi-geo-alt-fill"></i>

            Gral. José María Paz 576,
            San Miguel de Tucumán

          </p>

          <div class="mapa-contacto">

            <iframe
              src="https://www.google.com/maps?q=Gral.+José+María+Paz+576,+San+Miguel+de+Tucumán&output=embed"
              width="100%"
              height="100%"
              style="border:0;"
              allowfullscreen=""
              loading="lazy">
            </iframe>

          </div>

        </div>

      </div>

    </div>
     <div class="text-center mt-5 d-flex justify-content-center">

      <a href="../index.html" class="boton-volver">
       <i class="bi bi-arrow-left"></i>
              Volver al inicio
       </a>

</div>
  </section>

  <!-- Bootstrap JS -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
  </script>

</body>
</html>
