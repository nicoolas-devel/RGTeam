<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="./css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&display=swap" rel="stylesheet">
    <title>RGTeam</title>
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-rg">

        <div class="container-fluid">

            <!-- LOGO -->
            <a class="navbar-brand logo" href="#">

            <span class="logo-rg">RG</span>
            <span class="logo-team">Team</span>

            </a>
            <!-- BOTON RESPONSIVE -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContenido">

                <span class="navbar-toggler-icon"></span>

            </button>

            <!-- CONTENIDO -->
            <div class="collapse navbar-collapse" id="navbarContenido">

                <!-- LINKS -->
                <ul class="navbar-nav mx-auto">

                    <li class="nav-item">
                        <a class="nav-link active" href="#">
                            INICIO
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            JUEGOS
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            CONTACTO
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            ACERCA DE
                        </a>
                    </li>

                </ul>

                <!-- BUSCADOR -->
                <form class="d-flex search-box me-3">

                    <input class="form-control input-search"
                    type="search"
                    placeholder="Buscar juegos...">

                    <button class="btn btn-search" type="submit">
                        <i class="bi bi-search"></i>
                    </button>

                </form>

                <!-- BOTONES -->
                <div class="d-flex gap-2 buttons-container">

                    <button class="btn btn-rg">
                        <i class="bi bi-cart"></i>
                        CARRITO
                    </button>

                    <button class="btn btn-rg">
                        <i class="bi bi-person"></i>
                        LOGIN
                    </button>

                    <button class="btn btn-rg">
                        <i class="bi bi-person-plus"></i>
                        REGISTRO
                    </button>

                </div>

            </div>

        </div>

    </nav>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
